name: CI

on:
  push:
    branches: [dev-branch, main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test portable core
        run: Scripts/validate-portable-core.sh

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release-candidate gate
        run: Scripts/validate-release-candidate.sh
