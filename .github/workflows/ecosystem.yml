name: Ecosystem compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  pinned-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pinned repositories and run shared conformance corpus
        run: Scripts/validate-ecosystem-integration.sh
