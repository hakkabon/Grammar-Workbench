name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SOURCE_VERSION=$(sed -n 's/.*public static let version = "\([0-9.]*\)".*/\1/p' Sources/GrammarWorkbench/ProductionSupport.swift)
          test "v$SOURCE_VERSION" = "${{ github.ref_name }}"
      - name: Release-candidate gate
        run: Scripts/validate-release-candidate.sh
      - name: Package unsigned release artifacts
        env:
          ARCHS: arm64 x86_64
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/release
        run: Scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Grammar-Workbench-macOS
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SOURCE_VERSION=$(sed -n 's/.*public static let version = "\([0-9.]*\)".*/\1/p' Sources/GrammarWorkbench/ProductionSupport.swift)
          test "v$SOURCE_VERSION" = "${{ github.ref_name }}"
      - name: Validate Linux delivery
        run: Scripts/validate-linux-delivery.sh
      - name: Package Linux release
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release
        run: Scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Grammar-Workbench-Linux-x86_64
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
